<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RBACPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<div class="auth-page">

  <a href="index.html" class="auth-brand">
    <span class="brand-icon">R</span>
    RBAC<span>Pro</span>
  </a>

  <div class="auth-card">

    <div class="auth-heading">
      <div class="auth-icon">↗️</div>
      <h1>Welcome Back</h1>
      <p>Sign in to access your management dashboard.</p>
    </div>

    <form id="loginForm">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginBtn" class="auth-submit">
        Sign In →
      </button>

    </form>

    <p id="message" class="auth-message" aria-live="polite"></p>

    <div class="auth-switch">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <a href="index.html" class="auth-back">← Back to Home</a>

  </div>

  <p class="auth-copyright">RBACPro © 2026</p>

</div>

<script src="config.js"></script>
<script src="js/login.js"></script>
<script src="js/common.js"></script>
</body>
</html>
