<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | RBACPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<div class="auth-page">

  <a href="index.html" class="auth-brand">
    <span class="brand-icon">R</span>
    RBAC<span>Pro</span>
  </a>

  <div class="auth-card">

    <div class="auth-heading">
      <div class="auth-icon">✦</div>
      <h1>Create Account</h1>
      <p>Join RBACPro and create your secure workspace.</p>
    </div>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        minlength="3"
        maxlength="10"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        required
      >

      <button type="submit" id="registerBtn" class="auth-submit">
        Create Account →
      </button>

    </form>

    <p id="message" class="auth-message" aria-live="polite"></p>

    <div class="auth-switch">
      Already have an account?
      <a href="login.html">Sign In</a>
    </div>

    <a href="index.html" class="auth-back">← Back to Home</a>

  </div>

  <p class="auth-copyright">RBACPro © 2026</p>

</div>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/register.js"></script>

</body>
</html>
